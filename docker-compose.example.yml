services:
  kiyomi:
    build: .
    container_name: kiyomi
    restart: unless-stopped
    environment:
      KIYOMI_SMTP_SERVER: smtp.gmail.com
      KIYOMI_SMTP_PORT: 587
      KIYOMI_SMTP_USERNAME: you@gmail.com
      KIYOMI_SMTP_PASSWORD: yourpassword
      KIYOMI_SMTP_FROM_EMAIL: you@gmail.com
      KIYOMI_SMTP_TO_EMAIL: yourkindle_xxxxxx@kindle.com
      KIYOMI_SMTP_SUBJECT: kiyomi
      KIYOMI_DELETE: "true"
      KIYOMI_SIZE_LIMIT_MB: 25
      RUST_LOG: info
    volumes:
      - ./manga:/manga
      - ./cache:/cache
    # Match the UID/GID that owns ./manga on the host if it isn't 1000:1000
    # user: "1000:1000"
